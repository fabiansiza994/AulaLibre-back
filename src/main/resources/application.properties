# ============================================================
# AULALIBRE - GENERAL CONFIGURATION
# ============================================================

spring.application.name=aulalibre

# ------------------------------------------------------------
# ACTIVE PROFILE
# ------------------------------------------------------------

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ============================================================
# FLYWAY
# ============================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# ============================================================
# JWT
# ============================================================

aulalibre.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-please-override-in-production-0123456789}
aulalibre.jwt.expiration-minutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:60}


# ============================================================
# CORS
# ============================================================

aulalibre.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}


# ============================================================
# SERVER
# ============================================================

server.port=${SERVER_PORT:8080}


# ============================================================
# ERROR HANDLING
# ============================================================

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never


# ============================================================
# LOGGING
# ============================================================

logging.level.root=INFO