# ============================================================
# AULALIBRE - DEVELOPMENT PROFILE
# ============================================================


# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aulalibre}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:0000}
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# DEVELOPMENT DATABASE SEED
# ============================================================
# mode=always is required because Boot only auto-runs data scripts for
# embedded DBs by default — this project uses PostgreSQL even in dev.
# Order matters: rooms.block_id is a NOT NULL FK into blocks, so blocks
# must load first. Users have no dependency on either.

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/dev/data-dev-blocks.sql,classpath:db/dev/data-dev-rooms.sql,classpath:db/dev/data-dev-users.sql


# ============================================================
# DEVELOPMENT LOGGING
# ============================================================

logging.level.org.hibernate.SQL=DEBUG