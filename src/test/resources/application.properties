spring.datasource.url=jdbc:h2:mem:aulalibre;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Isolated test-only JWT secret — never shared with dev/prod.
aulalibre.jwt.secret=test-only-secret-key-for-junit-not-for-any-real-environment-0000
aulalibre.jwt.expiration-minutes=60

aulalibre.cors.allowed-origins=http://localhost:5173,http://localhost:3000

